<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="keyboardEvent.css">
</head>
<body>
    <h1>Keyboard Event</h1>
    <div id="testArea">
        <p>Keyboard Event</p>
        <label>Keydown</label><br>
        <input type="text" class="input" id="down" placeholder="Enter text here"><br>
        <label>Keyup</label><br>
        <input type="text" class="input" id="up" placeholder="Enter text here"><br>
        <label>Keypress</label><br>
        <input type="text" class="input" id="press" placeholder="Enter text here"><br>
    </div>
    <script>
        const down = document.getElementById("down");
        down.addEventListener("keyup", ()=>{document.getElementById("testArea").style.backgroundColor = down.value;});
        // const up = document.getElementById("up");
        // up.addEventListener("keyup", ()=>{alert(document.getElementById("up").value);});
        // const press = document.getElementById("press");
        // press.addEventListener("keypress", ()=>{alert(document.getElementById("press").value);});
    </script>
</body>
</html>
