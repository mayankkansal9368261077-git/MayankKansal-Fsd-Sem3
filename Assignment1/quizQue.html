<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions</title>
    <link rel="stylesheet" href="Quiz.css">
</head>
<body>
    <div id="quiz-container">
        <div id="question-container">
            <h2 id="Question">Question ?</h2>
            <input type="radio" id="option1" name="options" value="option1"> 
            <label for="option1" id="option1-label">Option 1</label><br>
            <input type="radio" id="option2" name="options" value="option2">
            <label for="option2" id="option2-label">Option 2</label><br>
            <input type="radio" id="option3" name="options" value="option3">
            <label for="option3" id="option3-label">Option 3</label><br>
            <input type="radio" id="option4" name="options" value="option4">
            <label for="option4" id="option4-label">Option 4</label><br>
        </div>
        <div id="Button-container">
            <button id="next">Next Question</button>
        </div>
    </div>
    <script src="Quiz.js"></script>
</body>
</html>
